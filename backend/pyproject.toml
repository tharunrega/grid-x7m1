[project]
name = "uk-wind-power-buying-portal-backend"
version = "1.0.0"
description = "FastAPI backend for UK day-ahead wind power procurement using Elexon BMRS FUELHH and WINDFOR streams"
readme = "../README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
